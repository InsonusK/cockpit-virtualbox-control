<div class="detail-section">
    <h3>Общая</h3>
    <div class="detail-grid">
        <div><span>CPU:</span> <span x-text="details.general.cpu"></span></div>
        <div><span>Memory:</span> <span x-text="details.general.memory"></span></div>
        <div><span>ОС:</span> <span x-text="details.general.os"></span></div>
        <div><span>VRDE port:</span> <span x-text="details.general.vrdePort"></span></div>
    </div>
</div>

<div class="detail-section">
    <h3>Сети</h3>
    <template x-if="details.networks.length">
        <table class="detail-table">
            <thead>
                <tr><th>Adapter</th><th>Тип</th><th>MAC</th><th>Включена</th><th>Проброс портов</th></tr>
            </thead>
            <tbody>
                <template x-for="n in details.networks" :key="n.slot">
                    <tr>
                        <td x-text="n.slot"></td>
                        <td x-text="n.type"></td>
                        <td x-text="n.mac"></td>
                        <td x-text="n.enabled ? 'да' : 'нет'"></td>
                        <td>
                            <template x-if="n.portForwarding.length">
                                <div>
                                    <template x-for="pf in n.portForwarding" :key="pf">
                                        <div x-text="pf"></div>
                                    </template>
                                </div>
                            </template>
                            <template x-if="!n.portForwarding.length">
                                <span class="empty-msg">—</span>
                            </template>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>
    <template x-if="!details.networks.length">
        <p class="empty-msg">Нет настроенных сетей</p>
    </template>
</div>

<div class="detail-section">
    <h3>Носители</h3>
    <template x-if="details.media.length">
        <table class="detail-table">
            <thead><tr><th>Тип</th><th>Путь</th><th>Размер</th></tr></thead>
            <tbody>
                <template x-for="m in details.media" :key="m.path">
                    <tr>
                        <td x-text="m.type"></td>
                        <td x-text="m.path"></td>
                        <td x-text="m.size"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>
    <template x-if="!details.media.length">
        <p class="empty-msg">Нет носителей</p>
    </template>
</div>

<div class="detail-section">
    <h3>USB устройства</h3>
    <template x-if="details.usb.length">
        <table class="detail-table">
            <thead>
                <tr><th>USB устройство</th><th>Статус</th><th>Автоподключение</th></tr>
            </thead>
            <tbody>
                <template x-for="u in details.usb" :key="u.label">
                    <tr>
                        <td x-text="u.label"></td>
                        <td x-text="u.active ? 'подключено' : 'не подключено'"></td>
                        <td x-text="u.autoConnect ? 'да' : 'нет'"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>
    <template x-if="!details.usb.length">
        <p class="empty-msg">Нет USB устройств</p>
    </template>
</div>

<div class="detail-section">
    <h3>Общие папки</h3>
    <template x-if="details.sharedFolders.length">
        <table class="detail-table">
            <thead>
                <tr><th>Название</th><th>Путь на хосте</th><th>Путь в гостевой ОС</th><th>Только чтение</th><th>Автоподключение</th></tr>
            </thead>
            <tbody>
                <template x-for="sf in details.sharedFolders" :key="sf.name">
                    <tr>
                        <td x-text="sf.name"></td>
                        <td x-text="sf.hostPath"></td>
                        <td x-text="sf.guestPath"></td>
                        <td x-text="formatFlag(sf.readOnly)"></td>
                        <td x-text="formatFlag(sf.autoMount)"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>
    <template x-if="!details.sharedFolders.length">
        <p class="empty-msg">Нет общих папок</p>
    </template>
</div>
