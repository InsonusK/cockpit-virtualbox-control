<div class="modal" x-show="$store.snapshotModal.isOpen" x-cloak>
    <div class="modal-box" @click.outside="$store.snapshotModal.close()">
        <h2 x-text="$store.snapshotModal.title"></h2>

        <p class="empty-msg" x-show="$store.snapshotModal.loading">Загрузка...</p>

        <div id="snapshot-list">
            <template x-if="!$store.snapshotModal.loading && $store.snapshotModal.snapshots.length === 0">
                <p class="empty-msg">Снапшотов пока нет.</p>
            </template>
            <template x-for="name in $store.snapshotModal.snapshots" :key="name">
                <div class="snapshot-item">
                    <span x-text="name"></span>
                    <button class="btn btn-small" @click="$store.snapshotModal.restore(name)">Восстановить</button>
                </div>
            </template>
        </div>

        <div class="snapshot-new">
            <input id="snapshot-name" type="text" placeholder="Имя нового снапшота" x-model="$store.snapshotModal.newName" @keydown.enter="$store.snapshotModal.take()">
            <button id="snapshot-take-btn" class="btn" @click="$store.snapshotModal.take()">Создать</button>
        </div>

        <button id="snapshot-close-btn" class="btn btn-secondary" @click="$store.snapshotModal.close()">Закрыть</button>
    </div>
</div>
