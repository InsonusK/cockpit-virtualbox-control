<div class="vm-header" @click="toggleDetails" title="Нажмите для просмотра деталей">
    <div class="vm-info">
        <span class="vm-name" x-text="vm.name"></span>
        <span class="vm-state">
            <template x-if="loadingState">
                <span>
                    <span class="dot dot-off"></span>
                    <span>Загрузка...</span>
                </span>
            </template>
            <template x-if="!loadingState">
                <span>
                    <span class="dot" :class="stateDotClass(state)"></span>
                    <span x-text="stateLabel(state)"></span>
                </span>
            </template>
        </span>
    </div>
<div class="vm-actions">
        <template x-if="isRunning()">
            <span>
                <button class="btn btn-small" :disabled="processing" :class="{'btn-active': activeCommand === 'savestate'}" @click.stop="runControl('savestate')">Сохранить состояние</button>
                <button class="btn btn-small" :disabled="processing" :class="{'btn-active': activeCommand === 'acpipowerbutton'}" @click.stop="runControl('acpipowerbutton')">ACPI выключение</button>
            </span>
        </template>
        <template x-if="isPaused()">
            <span>
                <button class="btn btn-small" :disabled="processing" :class="{'btn-active': activeCommand === 'resume'}" @click.stop="runControl('resume')">Продолжить</button>
            </span>
        </template>
        <template x-if="isOff()">
            <span>
                <button class="btn btn-small" :disabled="processing" :class="{'btn-active': activeCommand === 'start:headless'}" @click.stop="runStart('headless')">Запустить (headless)</button>
                <button class="btn btn-small" :disabled="processing" :class="{'btn-active': activeCommand === 'start:gui'}" @click.stop="runStart('gui')">Запустить (GUI)</button>
            </span>
        </template>
        <div class="dropdown" @click.outside="closeDropdown()">
            <button class="btn btn-small btn-secondary" :disabled="processing" @click.stop="toggleDropdown()">Ещё &#9662;</button>
            <div class="dropdown-menu" x-show="dropdownOpen" x-cloak>
                <template x-if="isRunning()">
                    <button class="btn btn-small dropdown-item" :disabled="processing" :class="{'btn-active': activeCommand === 'pause'}" @click.stop="runControl('pause')">Пауза</button>
                </template>
                <template x-if="isRunning() || isPaused()">
                    <button class="btn btn-small btn-danger dropdown-item" :disabled="processing" :class="{'btn-active': activeCommand === 'poweroff'}" @click.stop="runControl('poweroff')">Force off</button>
                </template>
                <template x-if="isRunning()">
                    <button class="btn btn-small dropdown-item" :disabled="processing" :class="{'btn-active': activeCommand === 'vrde-restart'}" @click.stop="runVrdeRestart()">Перезагрузка VRDE</button>
                </template>
                <button class="btn btn-small btn-secondary dropdown-item" :disabled="processing" @click.stop="openSnapshots()">Снапшоты</button>
            </div>
        </div>
    </div>
</div>
<div class="vm-details" x-show="expanded" x-cloak>
    <p class="empty-msg" x-show="loadingDetails">Загрузка деталей...</p>
    <template x-if="!loadingDetails && details">
        <div class="vm-details-content">
            <x-include src="components/vm-details/vm-details.html"></x-include>
        </div>
    </template>
    <p class="empty-msg" x-show="!loadingDetails && !details">Не удалось загрузить детали</p>
</div>
