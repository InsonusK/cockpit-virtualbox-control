name: PR checks

# Gate for PRs targeting `master`: tests must pass, and src/manifest.json's
# version must be bumped above the version already on master. Both checks
# only run when src/ or tests/ actually changed.
on:
  pull_request:
    branches: [master]

jobs:
  code-changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              
  workflow-changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '.github/workflows/pr-master.yml'

  run-tests:
    needs: [code-changes, workflow-changes] 
    if: needs.code-changes.outputs.src == 'true' || needs.workflow-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test


  version-check:
    needs: code-changes
    if: needs.code-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch base ref
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check manifest version was bumped
        run: node scripts/check-version-bump.js ${{ github.event.pull_request.base.sha }}

  test-summary:
    name: test-summary
    needs: [run-tests, version-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.run-tests.result }}" = "failure" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.version-check.result }}" = "failure" ]; then
            echo "Version check failed"
            exit 1
          fi
          echo "Tests passed or skipped"