name: PR checks

# Gate for PRs targeting `master`: tests must pass, and src/manifest.json's
# version must be bumped above the version already on master.
on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch base ref
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check manifest version was bumped
        run: node scripts/check-version-bump.js ${{ github.event.pull_request.base.sha }}
