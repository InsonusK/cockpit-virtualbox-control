<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VirtualBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>VirtualBox</h1>
            <div class="header-actions">
                <span id="status-msg"></span>
                <button id="refresh-btn" class="btn">Обновить</button>
            </div>
        </header>
        <div id="vm-list"></div>
    </div>

    <div id="snapshot-modal" class="modal hidden">
        <div class="modal-box">
            <h2 id="snapshot-title">Снапшоты</h2>
            <div id="snapshot-list"></div>
            <div class="snapshot-new">
                <input id="snapshot-name" type="text" placeholder="Имя нового снапшота">
                <button id="snapshot-take-btn" class="btn">Создать</button>
            </div>
            <button id="snapshot-close-btn" class="btn btn-secondary">Закрыть</button>
        </div>
    </div>

    <script src="../base1/cockpit.js"></script>
    <script src="app.js"></script>
</body>
</html>
